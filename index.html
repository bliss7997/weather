    /* Global Reset & Spacing */
    html, body {
      width: 100%;

      font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;

    }

    /* Brighter, Luminous & Lovely Pastel Gradient Backgrounds */
    .weather-bg {
      transition: background 0.8s ease-in-out;
    }
    .bg-clear-day {
      background: linear-gradient(160deg, #ffdeed 0%, #c4f0ff 50%, #fffbe3 100%);
    }
    .bg-cloudy {
      background: linear-gradient(160deg, #e2edfd 0%, #f3f7fc 50%, #fff0fa 100%);
    }
    .bg-rainy {
      background: linear-gradient(160deg, #b2cadf 0%, #dbe6f3 50%, #f4f8fc 100%);
    }
    .bg-snowy {

    /* Professional Pastel Card Base */
    .cute-pastel-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid #ffffff;
      border-radius: 26px;
      box-shadow: 0 10px 25px -4px rgba(255, 182, 193, 0.25), 0 6px 15px -4px rgba(147, 197, 253, 0.25);

    /* Dynamic Weather Card Pastel Background Colors */

      border: 2px solid #fef08a !important;
    }
    .card-bg-cloudy {

      border: 2px solid #bae6fd !important;

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.04); }
    }
    .animate-gentle {
      animation: gentleBounce 3s ease-in-out infinite;

    }

      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }

    // =========================================================================
    // Custom Toast Notification System
    // =========================================================================
    function showToast(message, type = 'error') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const bgColor = type === 'error' ? 'bg-white/95 border-rose-200 text-rose-600' : 'bg-white/95 border-sky-200 text-sky-600';
      const icon = type === 'error' ? '<i class="fa-solid fa-circle-exclamation text-rose-400 text-lg"></i>' : '<i class="fa-solid fa-circle-check text-sky-400 text-lg"></i>';
      
      toast.className = `${bgColor} backdrop-blur-md border-2 font-extrabold px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 transform transition-all duration-300 -translate-y-10 opacity-0 text-sm sm:text-base`;
      toast.innerHTML = `${icon}<span>${message}</span>`;
      
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('-translate-y-10', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-10', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    const regionsDb = KOREA_REGIONS_DB;

    function getChosung(str) {
      const KOREAN_CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 44032;
        if (code >= 0 && code <= 11172) {
          result += KOREAN_CHO[Math.floor(code / 588)];
        } else {
          result += str[i];
        }
      }
      return result;
    }

    function normalizeText(str) {
      return (str || '').toLowerCase().replace(/\s+/g, '');
    }

    function searchKoreaLocation(query) {
      const cleanQuery = normalizeText(query);
      if (!cleanQuery) return [];

      const isOnlyChosung = /^[ㄱ-ㅎ]+$/.test(cleanQuery);

      return regionsDb.filter(r => {
        const cleanName = normalizeText(r.name);
        const cleanFullName = normalizeText(r.fullName);
        const cleanProvince = normalizeText(r.province);
        const cleanKeywords = (r.keywords || []).map(normalizeText).join('');
        const combined = `${cleanName}${cleanFullName}${cleanProvince}${cleanKeywords}`;

        if (isOnlyChosung) {
          return getChosung(combined).includes(cleanQuery);
        }

        if (combined.includes(cleanQuery) || cleanQuery.includes(cleanName)) return true;
        if (r.keywords.some(kw => normalizeText(kw).includes(cleanQuery) || cleanQuery.includes(normalizeText(kw)))) return true;

        const shortProvince = cleanProvince.replace(/(특별)?자치(도|시)|광역시|특별시/g, '');
        if (shortProvince && (shortProvince.includes(cleanQuery) || cleanQuery.includes(shortProvince))) return true;

        return false;
      }).sort((a, b) => {
        const aNameMatch = normalizeText(a.name).includes(cleanQuery) || normalizeText(a.fullName).includes(cleanQuery);
        const bNameMatch = normalizeText(b.name).includes(cleanQuery) || normalizeText(b.fullName).includes(cleanQuery);
        if (aNameMatch && !bNameMatch) return -1;
        if (!aNameMatch && bNameMatch) return 1;
        return 0;
      });
    }

    let currentSelectedRegion = regionsDb.find(r => r.name === "용인시 수지구") || regionsDb[12];
    let selectedStartDate = new Date();
    let selectedEndDate = new Date();
    selectedEndDate.setDate(selectedStartDate.getDate() + 2);

    function formatDateStr(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function renderDropdownResults(query) {
      const matches = searchKoreaLocation(query);

      if (matches.length > 0) {
        dropdown.innerHTML = matches.map(r => `
          <div class="px-4 py-3 hover:bg-sky-50 cursor-pointer border-b border-slate-100 last:border-none flex justify-between items-center transition" data-name="${r.name}">

          </div>
        `).join('');
        dropdown.classList.remove('hidden');
      } else {
        dropdown.innerHTML = `
          <div class="px-4 py-3 text-xs font-bold text-slate-400 text-center">

    // =========================================================================
    // 🌐 Open-Meteo 실시간 날씨 세분화 맵핑 (한국 환경에 맞게 텍스트 수정)
    // =========================================================================
    function mapWmoToWeatherType(code) {
      // 0: 맑음, 1: 대체로 맑음
      if (code === 0 || code === 1) return { type: 'clear', name: '맑음', icon: '☀️', bgClass: 'bg-clear-day', cardClass: 'card-bg-clear', tip: '햇살이 기분 좋게 비추는 날이에요! 야외 활동 추천!' };
      // 2: 구름 조금
      if (code === 2) return { type: 'cloudy', name: '구름조금', icon: '⛅', bgClass: 'bg-cloudy', cardClass: 'card-bg-cloudy', tip: '선선하고 산책하기 딱 좋은 매력적인 날씨입니다.' };
      // 3: 흐림 (구름 많음)
      if (code === 3) return { type: 'overcast', name: '흐림', icon: '☁️', bgClass: 'bg-cloudy', cardClass: 'card-bg-cloudy', tip: '구름이 많은 날씨예요. 자외선 걱정 없이 돌아다니기 좋아요.' };
      // 45, 48: 안개
      if ([45, 48].includes(code)) return { type: 'cloudy', name: '안개', icon: '🌫️', bgClass: 'bg-cloudy', cardClass: 'card-bg-cloudy', tip: '안개가 짙으니 이른 아침이나 산간 도로 운전 시 주의하세요!' };
      // 51, 53, 55: 이슬비 / 61, 63: 가벼운 비
      if ([51, 53, 55, 61, 63].includes(code)) return { type: 'rainy', name: '약한 비', icon: '🌦️', bgClass: 'bg-rainy', cardClass: 'card-bg-rainy', tip: '가벼운 비가 내려요. 작은 우산 챙겨서 돌아다니기 괜찮아요!' };
      // 65: 강한 비, 80, 81, 82: 소나기
      if ([65, 80, 81, 82].includes(code)) return { type: 'rainy', name: '비/소나기', icon: '🌧️', bgClass: 'bg-rainy', cardClass: 'card-bg-rainy', tip: '우산 꼭 챙기시고 운치 있는 실내 여행 코스를 즐겨보세요!' };
      // 71, 73, 75, 77, 85, 86: 눈
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { type: 'snowy', name: '눈', icon: '❄️', bgClass: 'bg-snowy', cardClass: 'card-bg-snowy', tip: '눈이 내려 미끄러울 수 있으니 발걸음 조심해서 이동하세요!' };
      // 95, 96, 99: 천둥번개 / 폭우
      if ([95, 96, 99].includes(code)) return { type: 'rainy', name: '뇌우/폭우', icon: '⛈️', bgClass: 'bg-rainy', cardClass: 'card-bg-rainy', tip: '천둥번개를 동반한 비가 오니 가급적 실내에서 안전하게 휴식하세요.' };
      
      return { type: 'clear', name: '맑음', icon: '☀️', bgClass: 'bg-clear-day', cardClass: 'card-bg-clear', tip: '즐겁고 행복한 여행 보내세요!' };
    }

    // 타임존을 한국(Asia/Seoul)으로 명시하여 호출
    async function fetchRealWeatherData(lat, lon) {
      try {
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul`;
        const airUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&daily=pm10,pm2_5&timezone=Asia%2FSeoul`;

        const [resWeather, resAir] = await Promise.all([
          fetch(weatherUrl),
          fetch(airUrl).catch(() => null)
        ]);

        const weatherData = await resWeather.json();
        const airData = resAir ? await resAir.json() : null;

        return { weatherData, airData };
      } catch (err) {
        console.error("Open-Meteo API Fetch Error:", err);
        return null;
      }
    }

    function getPmBadge(pm10, pm25) {
      if (pm10 <= 30 && pm25 <= 15) return { text: '좋음', color: 'bg-emerald-100 text-emerald-800 border border-emerald-300' };
      if (pm10 <= 80 && pm25 <= 35) return { text: '보통', color: 'bg-blue-100 text-blue-800 border border-blue-300' };
      if (pm10 <= 150 && pm25 <= 75) return { text: '나쁨', color: 'bg-amber-100 text-amber-800 border border-amber-300' };
      return { text: '매우나쁨', color: 'bg-rose-100 text-rose-800 border border-rose-300' };
    }

    // Canvas Particles Animation Overlay
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(type) { this.reset(type); }
      reset(type) {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height;
        this.type = type;
        if (type === 'rainy') {
          this.length = Math.random() * 16 + 10;
          this.speed = Math.random() * 8 + 9;
          this.opacity = Math.random() * 0.35 + 0.15;
        } else if (type === 'snowy') {
          this.radius = Math.random() * 3.5 + 1.5;
          this.speed = Math.random() * 1.5 + 0.8;
          this.drift = Math.random() * 1 - 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
        } else {
          this.radius = Math.random() * 2.5 + 1;
          this.speed = Math.random() * 0.4 + 0.1;
          this.opacity = Math.random() * 0.3 + 0.15;
        }
      }
      update() {
        if (this.type === 'rainy') {
          this.y += this.speed;
          if (this.y > canvas.height) this.reset(this.type);
        } else if (this.type === 'snowy') {
          this.y += this.speed;
          this.x += this.drift;
          if (this.y > canvas.height) this.reset(this.type);
        } else {
          this.y -= this.speed;
          if (this.y < 0) this.reset(this.type);
        }
      }
      draw() {
        ctx.beginPath();
        if (this.type === 'rainy') {
          ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
          ctx.lineWidth = 1.3;
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x - 1, this.y + this.length);
          ctx.stroke();
        } else if (this.type === 'snowy') {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(255, 253, 220, ${this.opacity})`;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function initParticles(type) {
      particles = [];
      const count = type === 'rainy' ? 65 : (type === 'snowy' ? 40 : 20);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(type));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // UI 렌더링
    async function updateUI() {
      if (!selectedStartDate || !selectedEndDate) {
        showToast('여행 기간을 선택해 주세요.');

      const dailyListContainer = document.getElementById('dailyForecastList');

      const daily = realData.weatherData.daily;

      dailyListContainer.innerHTML = '';

      for (let i = 0; i < displayDaysCount; i++) {

        // API 전달 결과와 날짜 매핑
        let apiIdx = daily.time.indexOf(dateStr);
        if (apiIdx === -1) apiIdx = Math.min(i, daily.time.length - 1);

        const weatherCode = daily.weathercode[apiIdx] ?? 0;
        const weather = mapWmoToWeatherType(weatherCode);
        const highTemp = Math.round(daily.temperature_2m_max[apiIdx] ?? 20);
        const lowTemp = Math.round(daily.temperature_2m_min[apiIdx] ?? 10);
        const rainProb = Math.round(daily.precipitation_probability_max?.[apiIdx] ?? 0);

        const pm10 = airDaily?.pm10?.[apiIdx] ? Math.round(airDaily.pm10[apiIdx]) : 25;
        const pm25 = airDaily?.pm2_5?.[apiIdx] ? Math.round(airDaily.pm2_5[apiIdx]) : 12;

        if (i === 0) firstDayWeatherType = weather.type;

        // TOP SUMMARY ROW ITEM

        overviewItem.innerHTML = `
          <span class="text-sm font-black text-slate-800">${m}/${d} (${dayName})</span>
          <span class="text-3xl my-1.5 animate-gentle filter drop-shadow-sm">${weather.icon}</span>

          <div class="text-base font-black tracking-tight">
            <span class="text-rose-500">${highTemp}°</span>
            <span class="text-slate-300">/</span>
            <span class="text-sky-600">${lowTemp}°</span>
          </div>
        `;
        tempOverviewGrid.appendChild(overviewItem);

        // DAILY DETAIL CARD
        const pmBadge = getPmBadge(pm10, pm25);

        const card = document.createElement('div');
        card.className = `cute-pastel-card p-4 sm:p-5 shadow-sm fade-in ${weather.cardClass}`;
        card.innerHTML = `
          <div class="flex flex-col space-y-3">
            
            <div class="flex items-center justify-between border-b border-black/5 pb-2">
              <div class="flex items-center gap-2">
                <span class="font-black text-slate-900 text-base sm:text-lg">${m}월 ${d}일 (${dayName})</span>
                <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-white/90 text-sky-800 border border-sky-200 shadow-2xs">
                  ${i === 0 ? '1일차 (출발)' : `${i + 1}일차`}
                </span>
              </div>
              <div class="flex items-center gap-1 bg-white/90 px-2.5 py-0.5 rounded-xl border border-slate-200/80 shadow-2xs">
                <span class="text-xs font-bold text-slate-500">미세먼지</span>

                  ${pmBadge.text}
                </span>
              </div>
            </div>

            <div class="flex items-center justify-between px-1">
              
              <div class="flex items-center gap-3">
                <span class="text-4xl sm:text-5xl animate-gentle filter drop-shadow-sm shrink-0">${weather.icon}</span>
                <div>
                  <div class="text-base font-black text-slate-900">${weather.name}</div>
                  <div class="text-sm sm:text-base font-bold text-slate-600 mt-0.5">강수확률 <span class="text-sky-600 font-extrabold">${rainProb}%</span></div>

                </div>
              </div>

            </div>

            <div class="bg-white/80 rounded-xl px-3 py-2 border border-white/80 flex items-center gap-1.5 shadow-2xs">
              <span class="text-amber-500 text-sm shrink-0">💡</span>
              <span class="text-xs sm:text-sm font-extrabold text-slate-800 break-keep">${weather.tip}</span>
            </div>

          </div>
        `;

        dailyListContainer.appendChild(card);
      }

      document.body.className = `bg-clear-day min-h-screen relative text-slate-900 weather-bg flex flex-col justify-between py-6 px-3.5 ${mapWmoToWeatherType(daily.weathercode[0] ?? 0).bgClass}`;
      initParticles(firstDayWeatherType);
    }

    document.getElementById('searchBtn').addEventListener('click', executeSearch);

    window.onload = function() {
      searchInput.value = currentSelectedRegion.fullName;
      updateUI();
    };
  </script>
</body>
</html>
